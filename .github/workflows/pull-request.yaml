name: Pull Request

on:
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🧪 Build snap
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 🧪 Build snap
        uses: snapcrafters/ci/test-snap-build@main
