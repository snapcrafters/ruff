name: Pull Request

on:
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 🧪 Build and test snap
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 🧪 Build snap
        uses: snapcrafters/ci/test-snap-build@main
      - name: 🗒️ Run tests
        uses: snapcrafters/ci/run-tests@main
        with:
          test-script: ./test.sh
